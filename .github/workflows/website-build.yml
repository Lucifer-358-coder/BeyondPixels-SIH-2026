name: Website Build Verification

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Next.js Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package.json

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build
